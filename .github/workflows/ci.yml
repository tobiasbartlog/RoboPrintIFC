name: ci

# v2 (geführter Neustart): legacy/ wird nicht mehr geprüft.
# G1/G2 laufen als Schritte, sobald die Orakel-Dateien existieren (hashFiles).

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e "core[dev]"
      - name: Lint
        run: python -m ruff check core verify
      - name: Unit-Tests
        run: python -m pytest core -q
      - name: Gate G1 (Kinematik)
        if: ${{ hashFiles('verify/oracle/test_g1_kinematics.py') != '' }}
        run: python -m pytest verify/oracle/test_g1_kinematics.py -q
      - name: Gate G2 (Kollision)
        if: ${{ hashFiles('verify/oracle/test_g2_collision.py') != '' }}
        run: python -m pytest verify/oracle/test_g2_collision.py -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: Lint
        run: npm --prefix web run lint
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Unit-Tests
        run: npm --prefix web run test
