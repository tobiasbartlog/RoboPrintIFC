name: ci

# v2 (geführter Neustart): Jobs laufen, sobald core/ bzw. web/ existieren (Phase P0).
# legacy/ wird nicht mehr geprüft.

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('core/pyproject.toml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e "core[dev]"
      - name: Lint
        run: python -m ruff check core verify
      - name: Unit-Tests
        run: python -m pytest core -q
      - name: Gates G1 G2 (schnell)
        run: python scripts/verify.py --gate G1 G2

  web:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('web/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: Lint
        run: npm --prefix web run lint
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Unit-Tests
        run: npm --prefix web run test
